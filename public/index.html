<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>dot · message bridge</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <section id="login">
      <div class="login-card">
        <div class="orb">●</div>
        <p class="eyebrow">YOUR PRIVATE AI WORKSPACE</p>
        <h1>对话，不止于此。</h1>
        <p>通往当前 dot 的外部消息入口。需要先完成桥接连接。</p>
        <form id="login-form">
          <label for="token">访问口令</label
          ><input
            id="token"
            type="password"
            autocomplete="current-password"
            required
            placeholder="输入服务端设置的访问口令"
          /><button>进入工作空间 ↗</button>
        </form>
        <p id="login-error" role="alert"></p>
        <small>模型密钥仅保存在服务端，不进入浏览器。</small>
      </div>
    </section>
    <div id="workspace" hidden>
      <aside id="sidebar">
        <div class="brand"><b>● dot</b><span>message bridge</span></div>
        <button id="new-chat">＋ 新的对话</button>
        <p class="eyebrow">你的对话</p>
        <nav id="sessions"></nav>
        <footer>
          <p>独立运行 · 私密空间</p>
          <button id="logout" class="quiet">退出登录</button>
        </footer>
      </aside>
      <main>
        <header>
          <button id="menu" class="quiet" aria-label="切换侧栏">☰</button
          ><span id="title">新的对话</span>
          <div class="header-actions">
            <span id="model">pi agent</span
            ><button id="export" class="quiet">导出</button
            ><button id="delete" class="quiet">删除</button>
          </div>
        </header>
        <div id="notice" role="status"></div>
        <section id="messages" aria-live="polite">
          <div id="welcome">
            <p class="eyebrow">A LITTLE SPACE TO THINK</p>
            <h1>今天，想聊些什么？</h1>
            <p>整理思路、写点东西，或开始一个新计划。</p>
            <div class="suggestions">
              <button>帮我把一个模糊想法变成行动计划</button
              ><button>和我一起梳理今天的优先事项</button
              ><button>解释一个复杂概念，先从直觉开始</button>
            </div>
          </div>
        </section>
        <div class="compose-wrap">
          <form id="composer">
            <textarea
              id="prompt"
              rows="2"
              maxlength="16000"
              placeholder="发消息给 dot…"
              aria-label="消息内容"
            ></textarea>
            <div>
              <span>Enter 发送 · Shift + Enter 换行</span
              ><button id="send" type="submit">发送 ↑</button
              ><button id="stop" type="button" hidden>停止 ■</button>
            </div>
          </form>
          <p id="bridge-state" class="disclaimer">
            桥接未连接：此页面不会用其他模型冒充
            dot。完成插件连接与订阅后才能接收回复。
          </p>
        </div>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
